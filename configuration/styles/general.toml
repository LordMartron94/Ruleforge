# General
# A theme for any character, with no story attached. Dark fields, light text, and a
# palette built to be readable and to keep its marks apart.
#
# How it was made (the studio's Contrast and Colours-kept-apart panels run the same
# APCA and CIEDE2000 tests, and every one passes):
# - Value is size and lightness first, hue second: the tier text ladder steps down in
#   lightness every tier, and tiers T8-T10 are cool greys told apart by lightness alone.
# - Fields stay dark (lightness .15 to .31) so every tier colour meets its APCA target on
#   every field it is used on, and every border meets Lc 40 against its field.
# - The marks that share an item (rarity, links, sockets, corruption, fractured, veiled,
#   max-roll) were placed by search, inside hue windows that keep their usual meaning
#   (rare yellow, unique orange, magic blue), so every pair stays at least 20 apart.
Name = "General"
Suffix = "General"
Stylesheet = "../stylesheets/general.toml"
BaseTypes = "../basetypes/basetype_automation_config_new_theme.csv"

[Palette]
# Radiance: T0 and T1 invert, with a light field and deep ocean ink.
rad-t0-bg = "#FFF8E6"
rad-t0-border = "#17486B"
rad-t0-text = "#0B1B2E"
rad-t1-bg = "#FFC857"
rad-t1-border = "#17486B"
rad-t1-text = "#0B1B2E"

