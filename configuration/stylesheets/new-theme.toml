BorderColor = "bd-crafting"
Minimap = { Shape = "Moon" }
Beam = { Color = "Green", Temp = true }

[Final.Crafting.Normal]
Combination = ["Templates/Tiers/Mid/T5", "Templates/Groups/Crafting"]

[Final.Crafting.Magic]
Combination = ["Templates/Tiers/Mid/T5", "Templates/Groups/Crafting"]

[Templates.Alerts.Divine.T0]
DropSound = "hell.mp3"
DropVolume = 300

[Templates.Alerts.Divine.T1]
DropSound = "angels.mp3"
DropVolume = 300

[Templates.Alerts.High.T2]
DropSound = "amazing.mp3"
DropVolume = 200

# Game tiers describe roll potential; these styles are pickup priority.
[Final.Equipment.Tier5]
Combination = ["Templates/Groups/Equipment", "Templates/Tiers/High/T2"]
BorderColor = "t2-high"

[Final.Equipment.Tier4]
Combination = ["Templates/Groups/Equipment", "Templates/Tiers/High/T3"]
BorderColor = "t3-high"

[Final.Equipment.Tier3]
Combination = ["Templates/Groups/Equipment", "Templates/Tiers/High/T4"]
BorderColor = "t4-high"

[Final.Equipment.Tier2]
Combination = ["Templates/Groups/Equipment", "Templates/Tiers/Mid/T5"]
BorderColor = "t5-mid"

[Final.Equipment.Fated]
BorderColor = "bd-fated"

[Final.Maps.Exotic]
Combination = ["Templates/Groups/Maps", "Templates/Tiers/High/T2"]
BorderColor = "t2-high"

[Final.Maps.SevenMod]
Combination = ["Templates/Groups/Maps", "Templates/Tiers/High/T3"]
BorderColor = "t3-high"

[Final.Leagues.Wickerman.Unclassified]
Combination = ["Final/Leagues/Wickerman/T3", "Templates/Tiers/High/T3"]
BorderColor = "t3-high"

[Final.MapEnchantments.T1]
Combination = ["Final/Leagues/AllflameEmbers/T1"]

[Final.MapEnchantments.T2]
Combination = ["Final/Leagues/AllflameEmbers/T2"]

[Final.MapEnchantments.T3]
Combination = ["Final/Leagues/AllflameEmbers/T3"]

[Final.MapEnchantments.T4]
Combination = ["Final/Leagues/AllflameEmbers/T4"]

[Final.Leagues.EssenceOfTrickery]
Combination = ["Templates/Groups/Orbs", "Templates/Tiers/High/T2"]
