# Aryzel: the loot filter of Martron Arada, exiled prince of Aryzel.
#
# One stylesheet, four palettes: configuration/styles/aryzel-*.toml recolour it for
# each phase of the arc (Stranded Prince, First Whisper, Twilight, Son of Darkness).
#
# How it reads
# - Heraldry's rule of tincture: light "metal" text on dark "colour" fields, which is
#   also what keeps labels readable over the game world.
# - Value: T0 and T1 invert (Templates/Radiance): an ivory field for the body of light,
#   a gold field for the crown. Below that, text brightness and size fall with value:
#   gold (T2-T4), the phase colour (T5-T7), then silver/bone (T8-T10).
# - Beams follow the sun going down the ladder: white, yellow, orange, red, purple.
# - Fields (backgrounds) say what kind of item it is; borders say what is special
#   about it. Hidden item state (quality, fractured, corrupted, veiled and max-roll)
#   outranks the socket/link reminder; rarity is the fallback.
# - League items keep a colour that points at their league in every phase:
#     Breach violet (wombgifts stay Breach, the hive is Breach; Foulborn currency gets a flesh-pink border)
#     Delve azurite, Harvest grove green, Incursion temple jade, Heist harbour slate
#     (contracts: parchment and wax red, blueprints: blueprint blue, markers: coin gold,
#     mercenary warrants: copper, hired blades), Kalguur rust (Expedition, runic teal
#     for Runegrafts), Eldritch void (Exarch embers: fire, Eater ichors: cyan),
#     Allflame voyages on the abyssal sea (spectral green, cursed-gold ducats, sea-foam
#     charts), Astral indigo (djinn turquoise for Mirage, brass for Astrolabes),
#     Legion stasis (Enshrouding Crystals: ice).
#
# Colours are palette names; the palettes live in the style files. The studio checks
# every final style's contrast and the [Studio.Distinct] groups at the end of this file.

# Channel ownership and precedence are documented in configuration/CHANNELS.md.
# Text and size always encode global pickup priority. Background encodes purpose;
# border encodes the selected property. T0/T1 radiance wins over property borders.
# Beam/icon colour encodes rank, except the subordinate green crafting landing cue.
# Shape encodes purpose, never rarity. T0-T2 sound wins over category sound.

