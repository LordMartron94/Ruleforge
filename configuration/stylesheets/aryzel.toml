DropVolume = 300

[Templates.Groups.Crafting]
# Forge field and edge mark crafting eligibility; rarity yields this channel.
BackgroundColor = "bg-crafting"
BorderColor = "bd-crafting"
Minimap = { Shape = "Moon" }
Beam = { Color = "Green", Temp = true }

[Final.Crafting.Normal]
Combination = ["Templates/Tiers/Mid/T5", "Templates/Groups/Crafting"]

[Final.Crafting.Magic]
Combination = ["Templates/Tiers/Mid/T5", "Templates/Groups/Crafting"]

[Studio.Distinct.CampaignFields]
Min = 10
Vars = ["bg-crafting", "bg-div-cards", "bg-equipment", "bg-flasks", "bg-gold", "bg-lab", "bg-old-equipment", "bg-old-flasks", "bg-orbs", "bg-skill-gems", "bg-special", "bg-supplies", "bg-unassociated-equipment"]
# Every field, including league ones, must stay apart.

[Studio.Distinct.AllFields]
Min = 6
Vars = ["bg-crafting", "bg-ancestral", "bg-astral", "bg-breach", "bg-delve", "bg-div-cards", "bg-eldritch", "bg-equipment", "bg-flasks", "bg-gold", "bg-harvest", "bg-heist", "bg-incursion", "bg-kalguur", "bg-lab", "bg-legion", "bg-maps", "bg-old-equipment", "bg-old-flasks", "bg-orbs", "bg-scarabs", "bg-sea", "bg-skill-gems", "bg-special", "bg-supplies", "bg-unassociated-equipment"]
# Borders that can appear on the same equipment field.

[Studio.Distinct.EquipmentMarks]
Min = 20
Vars = ["bd-normal", "bd-magic", "bd-rare", "bd-unique", "bd-3-link", "bd-4-link", "bd-6-link", "bd-4-socket", "bd-6-socket", "bd-rgb", "bd-corrupted", "bd-fractured", "bd-veiled", "bd-max-rolled"]
# Tier text colours from T2 down.

[Studio.Distinct.TierText]
Min = 8
Vars = ["t2", "t3", "t4", "t5", "t6", "t7", "t8", "t9", "t10"]
# The two inverted top tiers.

[Studio.Distinct.Radiance]
Min = 18
Vars = ["rad-t0-bg", "rad-t1-bg"]
# The crafting edge must not read as a rarity or property border.

[Studio.Distinct.CraftingMark]
Min = 15
Vars = ["bd-crafting", "bd-normal", "bd-magic", "bd-rare", "bd-unique", "bd-fractured"]

