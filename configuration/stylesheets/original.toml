# Original Ruleforge stylesheet (converted from original_theme.json).
#
# Styles are TOML tables named by their path, e.g. [Final.Orbs.T1] is "Final/Orbs/T1".
# A colour is a palette name from the style file ("t2"), or a literal "#RRGGBB" / "#RRGGBBAA".
# Combination merges other styles in order; later entries win, and the style's own properties win over all of them.

