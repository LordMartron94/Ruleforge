name: Economy collector image
on:
  push:
    branches: [main, development, 'codex/**']
    paths:
      - '.github/workflows/economy-image.yml'
      - 'deployment/economy/**'
      - '.dockerignore'
      - 'go.work'
      - 'ruleforge/components/ruleforge/**'
  pull_request:
    paths:
      - '.github/workflows/economy-image.yml'
      - 'deployment/economy/**'
      - 'ruleforge/components/ruleforge/**'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: economy-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Test affected modules
        run: go test -mod=mod ./ruleforge/components/ruleforge/data_generation/... ./ruleforge/components/ruleforge/compilation/... ./ruleforge/components/ruleforge/config/... ./ruleforge/components/ruleforge/rules/... ./ruleforge/components/ruleforge/entry/...
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lordmartron94/ruleforge-economy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/economy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
