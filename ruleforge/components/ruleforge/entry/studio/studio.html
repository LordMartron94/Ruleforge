<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleforge Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Deliberately single-theme: loot labels are judged against a dark game world. */
  :root {
    color-scheme: dark;
    --page: #0b0c11;
    --panel: #12141b;
    --panel-2: #191c25;
    --rule: #282b37;
    --text: #e7e1d0;
    --muted: #a29d90;
    --faint: #6f6c63;
    --accent: #ffca49;
    --ok: #86d3a4;
    --warn: #f1b75e;
    --bad: #f27d6c;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    --label: "Alegreya SC", "Palatino Linotype", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--page); }
  body { margin: 0; color: var(--text); font: 15px/1.5 var(--body); padding: 24px 16px 64px; }
  .wrap { max-width: 1320px; margin-inline: auto; display: grid; gap: 22px; }
  .stack { display: grid; gap: 18px; min-width: 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.2rem; }
  p { margin: 0; max-width: 72ch; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .eyebrow { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

  header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
  header.top .title { display: grid; gap: 8px; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tab, .seg button {
    background: transparent; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer;
    font-size: 0.88rem; color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 700; }
  .seg { display: inline-flex; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  select, input[type="number"] { background: var(--panel); border: 1px solid var(--rule); padding: 5px 8px; }
  .btn { background: var(--panel-2); border: 1px solid #3a3e4d; padding: 7px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 700; }
  .views { display: flex; gap: 6px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; flex-wrap: wrap; }

  /* Item labels, drawn the way the game draws them */
  .lbl {
    display: inline-block; font-family: var(--label); font-weight: 500; line-height: 1.12;
    padding: 0.12em 0.5em 0.16em; border: 2px solid transparent; white-space: nowrap; position: relative;
  }
  .drop { position: relative; display: inline-flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: 0; padding: 0; }
  .drop .beam { width: 4px; height: 46px; margin-bottom: 2px; border-radius: 2px; }
  .drop .beam.none { visibility: hidden; }
  .drop .beam.temp { opacity: .55; }
  .drop.hidden-item .lbl { opacity: .32; text-decoration: line-through; }
  .drop.selected .lbl { outline: 2px dashed var(--text); outline-offset: 3px; }
  .drop.unknown .lbl::after { content: "?"; position: absolute; top: -10px; right: -10px; background: var(--warn); color: #000; font: 700 11px/16px var(--mono); width: 16px; text-align: center; border-radius: 8px; }

  /* Loot view */
  .loot-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .loot-controls label { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }
  .loot-controls input[type="range"] { width: 160px; accent-color: var(--accent); }
  .loot-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .ground {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: 6px 18px;
    padding: 18px clamp(10px, 2vw, 26px) 26px; min-height: 360px; border: 1px solid var(--rule);
  }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 0.82rem var(--mono); color: var(--muted); }
  .summary b { color: var(--text); font-weight: 500; }
  .inspector { background: var(--panel); border: 1px solid var(--rule); padding: 16px; display: grid; gap: 14px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 0.86rem; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-family: var(--mono); font-size: 0.8rem; }
  .rule { border: 1px solid var(--rule); padding: 10px 12px; display: grid; gap: 8px; background: var(--page); }
  .rule.active { border-color: var(--accent); }
  .rule-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 0.78rem var(--mono); color: var(--muted); }
  .pill { font: 500 0.68rem/1 var(--mono); padding: 4px 7px; letter-spacing: .06em; text-transform: uppercase; }
  .pill.active { background: var(--accent); color: #17130a; }
  .pill.shadow { background: var(--panel-2); color: var(--muted); }
  .pill.show { background: rgba(134,211,164,.14); color: var(--ok); }
  .pill.hide { background: rgba(242,125,108,.16); color: var(--bad); }
  .pill.ok { background: rgba(134,211,164,.14); color: var(--ok); }
  .pill.warn { background: rgba(241,183,94,.14); color: var(--warn); }
  .pill.bad { background: rgba(242,125,108,.16); color: var(--bad); }
  .rule .src { font: 0.8rem var(--mono); color: var(--text); word-break: break-word; }
  .conds { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font: 0.76rem/1.35 var(--mono); color: var(--muted); }
  .conds b { color: var(--text); font-weight: 500; }
  .alerts { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 0.76rem var(--mono); color: var(--muted); align-items: center; }
  .swatch-dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; vertical-align: -1px; margin-right: 4px; }

  /* Palette view */
  .palette-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .checks { display: grid; gap: 9px; background: var(--panel); border: 1px solid var(--rule); padding: 14px; }
  .check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  .check .val { font: 0.8rem var(--mono); color: var(--muted); white-space: nowrap; }
  .fails { margin: 0; padding: 10px 0 0; border-top: 1px solid var(--rule); list-style: none; display: grid; gap: 3px; font: 0.75rem/1.35 var(--mono); color: var(--muted); max-height: 260px; overflow: auto; }
  .fails b { color: var(--warn); font-weight: 500; }
  .gallery-group { display: grid; gap: 8px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .tile { display: grid; gap: 4px; }
  .tile .stage { display: flex; justify-content: center; align-items: center; min-height: 58px; padding: 8px; background: #15161a; overflow: hidden; }
  .tile .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; }
  .tile .cap span:last-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  .tile .cap .near { color: var(--warn); }
  details.editor { background: var(--panel); border: 1px solid var(--rule); }
  details.editor > summary { cursor: pointer; padding: 12px 14px; font: 700 1.15rem var(--display); }
  .ed-body { padding: 0 14px 14px; display: grid; gap: 16px; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ed-group h4 { margin: 0 0 8px; font: 500 0.72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
  .ed-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; font: 0.78rem var(--mono); }
  .ed-row input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid #3a3e4d; background: none; cursor: pointer; }
  .ed-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-row.changed .nm { color: var(--accent); }
  .status { font: 0.8rem var(--mono); color: var(--ok); min-height: 1.2em; }
  textarea.fallback { width: 100%; min-height: 120px; background: var(--page); color: var(--text); border: 1px solid var(--rule); font: 0.75rem var(--mono); }
  .empty { color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 980px) {
    .loot-grid, .palette-grid { grid-template-columns: minmax(0, 1fr); }
    .inspector { position: static; max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <span class="eyebrow" id="generated">Ruleforge Studio</span>
      <h1>Ruleforge Studio</h1>
    </div>
    <div class="picker" id="script-picker" hidden>
      <label class="muted" for="script">Script</label>
      <select id="script"></select>
    </div>
  </header>

  <div class="picker" role="tablist" aria-label="Style" id="styles"></div>

  <nav class="views" role="tablist" aria-label="View">
    <button class="tab" role="tab" id="view-loot" type="button">Loot simulator</button>
    <button class="tab" role="tab" id="view-palette" type="button">Palette</button>
  </nav>

  <section id="loot" class="stack" style="gap:14px">
    <div class="loot-controls">
      <label for="area">Area level <input type="range" id="area" min="1" max="84"> <input type="number" id="area-num" min="1" max="84" style="width:64px"></label>
      <label for="count">Drops <select id="count"><option>12</option><option selected>30</option><option>60</option><option>120</option></select></label>
      <label for="mix">Mix <select id="mix"><option value="realistic">Realistic</option><option value="showcase">Showcase (every tier)</option></select></label>
      <label><input type="checkbox" id="show-hidden"> Show hidden items</label>
      <div class="seg" id="grounds" role="group" aria-label="Ground"></div>
      <button class="btn primary" id="roll" type="button">Roll new drop</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="loot-grid">
      <div class="ground" id="ground" aria-label="Dropped items"></div>
      <aside class="inspector" id="inspector" aria-live="polite"></aside>
    </div>
  </section>

  <section id="palette" class="stack" hidden>
    <div class="palette-grid">
      <div class="checks" id="checks"></div>
      <div class="checks" id="distinct"></div>
    </div>
    <details class="editor" id="editor">
      <summary>Adjust this style's palette</summary>
      <div class="ed-body">
        <p class="muted">Change a colour and every label on both views updates. Copy the changes and paste them into the style file's [Palette] table (or back to Claude). Edits are kept in this browser only.</p>
        <div class="ed-actions">
          <button class="btn primary" id="copy-changes" type="button">Copy changes as TOML</button>
          <button class="btn" id="reset" type="button">Reset this style</button>
          <span class="status" id="status" role="status"></span>
        </div>
        <textarea class="fallback" id="fallback" hidden readonly aria-label="Copy this text"></textarea>
        <div id="ed-groups" class="stack"></div>
      </div>
    </details>
    <div id="gallery" class="stack"></div>
  </section>
</div>

<script id="studio-data" type="application/json">/*STUDIO_DATA*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('studio-data').textContent);
// Blocks point at a shared list of condition sets; attach them once.
if (DATA) DATA.filters.forEach(f => f.blocks.forEach(b => {
  b.conditions = DATA.conditions[b.cond] || [];
  b.source = DATA.sources[b.src] || '';
  b.look = DATA.looks[b.lk] || {};
}));

/* ---------- colour science ---------- */
function hex2rgba(h) {
  const v = h.replace('#', '');
  const a = v.length === 8 ? parseInt(v.slice(6, 8), 16) / 255 : 1;
  return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) / 255).concat(a);
}
function flatten(hex, under = [0.07, 0.07, 0.08]) {
  const [r, g, b, a] = hex2rgba(hex);
  return [r * a + under[0] * (1 - a), g * a + under[1] * (1 - a), b * a + under[2] * (1 - a)];
}
const lin = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
function apca(txt, bg) {
  const Y = rgb => 0.2126729 * rgb[0] ** 2.4 + 0.7151522 * rgb[1] ** 2.4 + 0.0721750 * rgb[2] ** 2.4;
  const clamp = y => y > 0.022 ? y : y + (0.022 - y) ** 1.414;
  const yt = clamp(Y(txt)), yb = clamp(Y(bg));
  if (Math.abs(yb - yt) < 0.0005) return 0;
  if (yb > yt) { const s = (yb ** 0.56 - yt ** 0.57) * 1.14; return s < 0.1 ? 0 : (s - 0.027) * 100; }
  const s = (yb ** 0.65 - yt ** 0.62) * 1.14; return s > -0.1 ? 0 : (s + 0.027) * 100;
}
function lab(rgb) {
  const [r, g, b] = rgb.map(lin);
  const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, Yv = 0.2126 * r + 0.7152 * g + 0.0722 * b, Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const fx = f(X), fy = f(Yv), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function de2000(c1, c2) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const [L1, a1, b1] = lab(c1), [L2, a2, b2] = lab(c2);
  const Cb = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2;
  const G = 0.5 * (1 - Math.sqrt(Cb ** 7 / (Cb ** 7 + 25 ** 7)));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h1p = (Math.atan2(b1, a1p) * deg + 360) % 360, h2p = (Math.atan2(b2, a2p) * deg + 360) % 360;
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dh = h2p - h1p;
  if (C1p * C2p === 0) dh = 0; else if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dh * rad / 2);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp;
  if (C1p * C2p === 0) hbp = h1p + h2p;
  else if (Math.abs(h1p - h2p) > 180) hbp = (h1p + h2p < 360) ? (h1p + h2p + 360) / 2 : (h1p + h2p - 360) / 2;
  else hbp = (h1p + h2p) / 2;
  const T = 1 - 0.17 * Math.cos((hbp - 30) * rad) + 0.24 * Math.cos(2 * hbp * rad) + 0.32 * Math.cos((3 * hbp + 6) * rad) - 0.20 * Math.cos((4 * hbp - 63) * rad);
  const dth = 30 * Math.exp(-(((hbp - 275) / 25) ** 2));
  const RC = 2 * Math.sqrt(Cbp ** 7 / (Cbp ** 7 + 25 ** 7));
  const SL = 1 + 0.015 * (Lbp - 50) ** 2 / Math.sqrt(20 + (Lbp - 50) ** 2), SC = 1 + 0.045 * Cbp, SH = 1 + 0.015 * Cbp * T;
  const RT = -Math.sin(2 * dth * rad) * RC;
  return Math.sqrt((dLp / SL) ** 2 + (dCp / SC) ** 2 + (dHp / SH) ** 2 + RT * (dCp / SC) * (dHp / SH));
}
// APCA target by font size: bigger labels can carry a little less contrast.
const textTarget = fs => fs >= 44 ? 75 : fs >= 36 ? 70 : fs >= 27 ? 60 : fs >= 23 ? 50 : 42;

/* ---------- state ---------- */
const store = {
  get(key, fallback) { try { const v = localStorage.getItem('ruleforge-studio:' + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem('ruleforge-studio:' + key, JSON.stringify(value)); } catch (e) {} },
};
const scripts = [...new Set(DATA.filters.map(f => f.script))];
const state = {
  view: store.get('view', 'loot'),
  script: scripts.includes(store.get('script', '')) ? store.get('script', '') : scripts[0],
  style: store.get('style', DATA.styles[0] && DATA.styles[0].id),
  ground: store.get('ground', 'strand'),
  area: store.get('area', 30),
  count: store.get('count', 30),
  mix: store.get('mix', 'realistic'),
  showHidden: store.get('showHidden', false),
  seed: store.get('seed', 1),
  edits: store.get('edits', {}),
  selected: 0,
};
if (!DATA.styles.some(s => s.id === state.style)) state.style = DATA.styles[0].id;
const persist = () => ['view', 'script', 'style', 'ground', 'area', 'count', 'mix', 'showHidden', 'seed', 'edits'].forEach(k => store.set(k, state[k]));
const currentStyle = () => DATA.styles.find(s => s.id === state.style);
const currentFilter = () => DATA.filters.find(f => f.script === state.script && f.style === state.style);
const palette = () => ({ ...currentStyle().palette, ...(state.edits[state.style] || {}) });
function colorOf(c, P) {
  if (!c) return null;
  if (c.var && P[c.var]) {
    // Keep the stylesheet's alpha if the palette value has none.
    const v = P[c.var];
    return v.length === 7 && c.hex.length === 9 ? v + c.hex.slice(7) : v;
  }
  return c.hex;
}

/* ---------- labels ---------- */
const DEFAULT_TEXT = { Normal: '#C8C8C8', Magic: '#8888FF', Rare: '#FFFF77', Unique: '#AF6025' };
const BEAM = { Red: '#ff4a3d', Green: '#4dff6b', Blue: '#4d86ff', Brown: '#a8672e', White: '#ffffff', Yellow: '#ffe23b', Cyan: '#3bf3ff', Grey: '#a0a0a0', Orange: '#ff9a2b', Pink: '#ff6bd3', Purple: '#b34bff' };
const px = fs => Math.max(10, (fs || 32) * 0.5);
function labelEl(text, look, P, rarity, scale = 1) {
  const el = document.createElement('span');
  el.className = 'lbl';
  el.textContent = text;
  const bg = colorOf(look.background, P) || '#000000F0';
  el.style.color = colorOf(look.text, P) || DEFAULT_TEXT[rarity] || '#C8C8C8';
  el.style.background = bg;
  el.style.borderColor = colorOf(look.border, P) || 'transparent';
  el.style.fontSize = (px(look.fontSize) * scale).toFixed(1) + 'px';
  return el;
}

/* ---------- random loot ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(r, items, weight = () => 1) {
  let total = 0; const w = items.map(i => { const v = Math.max(0, weight(i)); total += v; return v; });
  if (!total) return null;
  let x = r() * total;
  for (let i = 0; i < items.length; i++) { x -= w[i]; if (x <= 0) return items[i]; }
  return items[items.length - 1];
}
const ARMOUR_CLASSES = { 'Body Armours': 8, Helmets: 7, Gloves: 7, Boots: 7, Shields: 5 };
const JEWELLERY = { Rings: 3, Amulets: 2, Belts: 3 };
const FLASKS = ['Life Flasks', 'Mana Flasks', 'Hybrid Flasks', 'Utility Flasks'];
const CURRENCY_CATEGORIES = new Set(['Orbs', 'Supplies', 'Orbs-Mapping', 'Supplies-Mapping']);
const STACKABLE_CLASS = { Scarabs: 'Map Fragments', 'Map Fragments': 'Map Fragments', Essences: 'Stackable Currency', Oils: 'Stackable Currency' };
const socketCap = lvl => lvl <= 2 ? 2 : lvl <= 24 ? 3 : lvl <= 34 ? 4 : lvl <= 49 ? 5 : 6;
const pool = DATA.items;
const baseByName = new Map(pool.equipment.map(b => [b.name, b]));
const currencyBases = [...new Map(pool.stackables.filter(s => CURRENCY_CATEGORIES.has(s.category)).map(s => [s.base, s])).values()];
const leagueBases = [...new Map(pool.stackables.filter(s => !CURRENCY_CATEGORIES.has(s.category)).map(s => [s.category + '|' + s.base + '|' + (s.rarity || ''), s])).values()];
const stackSteps = new Map();
pool.stackables.forEach(s => { if (s.minStack) stackSteps.set(s.base, [...new Set([...(stackSteps.get(s.base) || []), s.minStack])].sort((a, b) => a - b)); });

function rollSockets(r, base, ilvl) {
  const max = Math.min(base.sockets || 0, socketCap(ilvl));
  if (!max) return { sockets: [], links: [] };
  const n = 1 + Math.floor(Math.pow(r(), 1.6) * max);
  const attr = [['R', base.str || 0], ['G', base.dex || 0], ['B', base.int || 0]];
  const sockets = [];
  for (let i = 0; i < n; i++) sockets.push(r() < 0.8 ? 'W' : pick(r, attr, a => a[1] + 10)[0]);

}
function renderEditor() {
  const style = currentStyle(), O = style.palette, E = state.edits[style.id] || {}, P = palette();
  const host = document.getElementById('ed-groups'); host.replaceChildren();
  const groups = new Map();
  Object.keys(O).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(k => {
    const g = paletteGroup(k); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(k);
  });
  for (const [title, keys] of groups) {
    const g = document.createElement('div'); g.className = 'ed-group';
    g.innerHTML = `<h4>${title}</h4>`;
    const grid = document.createElement('div'); grid.className = 'ed-grid';
    for (const k of keys) {
      const row = document.createElement('label'); row.className = 'ed-row' + (k in E ? ' changed' : '');
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = P[k].slice(0, 7).toLowerCase(); inp.id = `ed-${style.id}-${k}`;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = k;
      const hx = document.createElement('span'); hx.textContent = P[k].toUpperCase();
      inp.addEventListener('input', () => {
        const alpha = O[k].length === 9 ? O[k].slice(7) : '';
        const v = (inp.value + alpha).toUpperCase();
        state.edits[style.id] = state.edits[style.id] || {};
        if (v === O[k].toUpperCase()) delete state.edits[style.id][k]; else state.edits[style.id][k] = v;
        hx.textContent = v; row.classList.toggle('changed', k in state.edits[style.id]);
        persist(); refreshColours();
      });
      row.append(inp, nm, hx); grid.append(row);
    }
    g.append(grid); host.append(g);
  }
}
let refreshTimer = 0;
function refreshColours() {
  // Keep the editor in place so an open colour picker survives the re-render.
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { state.view === 'loot' ? renderLoot() : renderPalette(false); }, 60);
}

async function copyText(text, okMsg) {
  const status = document.getElementById('status'), fb = document.getElementById('fallback');
  try { await navigator.clipboard.writeText(text); status.textContent = okMsg; fb.hidden = true; }
  catch (e) { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); status.textContent = 'The clipboard is blocked here. The text is selected below; copy it by hand.'; }
}
document.getElementById('copy-changes').addEventListener('click', () => {
  const style = currentStyle(), E = state.edits[style.id] || {};
  const keys = Object.keys(E);
  if (!keys.length) { document.getElementById('status').textContent = 'Nothing changed yet.'; return; }
  copyText(`# ${style.file}, in the [Palette] table\n` + keys.map(k => `${k} = "${E[k]}"`).join('\n') + '\n', 'Copied the changed colours.');
});
document.getElementById('reset').addEventListener('click', () => {
  delete state.edits[state.style]; persist(); renderAll();
  document.getElementById('status').textContent = 'This style is back to its file.';
});

/* ---------- wiring ---------- */
function renderAll() {
  renderStyles();
  if (state.view === 'loot') { evaluate(); renderLoot(); } else renderPalette();
}
document.getElementById('view-loot').addEventListener('click', () => { state.view = 'loot'; persist(); renderAll(); });
document.getElementById('view-palette').addEventListener('click', () => { state.view = 'palette'; persist(); renderAll(); });
document.getElementById('script').addEventListener('change', e => { state.script = e.target.value; persist(); renderAll(); });
const area = document.getElementById('area'), areaNum = document.getElementById('area-num');
area.value = areaNum.value = state.area;
const setArea = v => { state.area = Math.min(84, Math.max(1, Number(v) || 1)); area.value = areaNum.value = state.area; persist(); roll(); renderLoot(); };
area.addEventListener('input', () => setArea(area.value));
areaNum.addEventListener('change', () => setArea(areaNum.value));
const count = document.getElementById('count'); count.value = String(state.count);
count.addEventListener('change', () => { state.count = Number(count.value); persist(); roll(); renderLoot(); });
const mix = document.getElementById('mix'); mix.value = state.mix;
mix.addEventListener('change', () => { state.mix = mix.value; persist(); roll(); renderLoot(); });
const showHidden = document.getElementById('show-hidden'); showHidden.checked = state.showHidden;
showHidden.addEventListener('change', () => { state.showHidden = showHidden.checked; persist(); renderLoot(); });
document.getElementById('roll').addEventListener('click', () => { state.seed++; state.selected = 0; persist(); roll(); renderLoot(); });

if (!DATA || !DATA.styles.length) {
  document.querySelector('.wrap').innerHTML = '<p>No styles were compiled, so there is nothing to show.</p>';
} else {
  roll();
  renderAll();
}
</script>
</body>
</html>
